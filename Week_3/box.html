<!DOCTYPE html>
<html>
<head>

<style>

body{
    margin: 0;
    height: 100vh;
    position: relative;
}

#box{
    width: 100px;
    height: 100px;
    background-color: red;
    position: absolute;
    top: 0px;
    left: 0px;
}

button{
    margin: 20px;
    padding: 10px 20px;
    align-items: center;
}

</style>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>

$(document).ready(function(){

    $("button").click(function(){

        $("#box").animate({
            top: "500px"
        }, 1000, function(){

            $("#box").css("background-color", "blue");

            $("#box").animate({
                left: "1360px"
            }, 1000, function(){

                $("#box").css("background-color", "green");

                $("#box").animate({
                    top: "0px"
                }, 1000, function(){

                    $("#box").css("background-color", "orange");

                    $("#box").animate({
                        left: "0px"
                    }, 1000, function(){

                        $("#box").css("background-color", "purple");

                    });

                });

            });

        });

    });

});

</script>

</head>

<body>

<button>Start Animation</button>
<div id="box"></div>
</body>
</html>
