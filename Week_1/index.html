<!-- Create a simple Student Profile Card webpage using HTML and CSS where you must use both ID selectors and class selectors to style the card, text, and button with hover effects. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: lightblue;
            font-family: Arial;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #profile_card {
            background-color: beige;
            width: 250px;
            padding: 20px;
            text-align: center;

            border: 3px solid darkblue;
        }

        .photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid black;
        }

        .student_name {
            color: darkblue;
        }

        .student_info {
            color: brown;
        }

        #view_button {
            background-color: green;
            color: yellow;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        #view_button:hover {
            background-color: orange;
            color: black;
        }
    </style>
</head>

<body>

    <div id="profile_card"> 

        <img class="photo" src="Student_Image.png" alt="Student Image">

        <h2 class="student_name">Avipsha Shrestha</h2>

        <p class="student_info">BSc.IT student</p>
        <p class="student_info">IT Enthusiast</p>
        <p class="student_info">Interested in web development</p>

        <button id="view_button">View Profile</button>

    </div>

</body>
</html>
