<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 40px 0;
        }

        .container {
            width: 550px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .form-row .field {
            flex: 1;
        }

        .field h4 {
           margin: 8px 0 5px 0;
           color: #444;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border: 1px solid #d4d4d4;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #5c8df6;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .button-group {
            text-align: center;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background-color: #5c8df6;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background-color: #4a79d8;
        }

        button:disabled {
            background-color: #b7c5e8;
            cursor: not-allowed;
        }

        .details-box {
            margin-top: 30px;
            padding: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .details-header h2 {
            margin: 0;
            font-size: 20px;
            color: #444;
        }

        #contact-info {
            line-height: 1.8;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Contact Us</h1>
        <p class="subtitle">Fill out the form below and your details will be saved.</p>
        
        <div class="form-row">
            <div class="field">
                <h4>Full Name</h4>
                <input type="text" id="fullname" placeholder="Full Name">
            </div>

            <div class="field">
                <h4>Email Address</h4>
                <input type="email" id="email" placeholder="Email Address">
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <h4>Phone Number</h4>
                <input type="text" id="phone" placeholder="Phone Number">
            </div>

            <div class="field">
                <h4>Subject</h4>
                <input type="text" id="subject" placeholder="Subject">
            </div>
        </div>

        <div class="field">
            <h4>Address</h4>
            <input type="text" id="address" placeholder="Address">
        </div>

        <div class="field">
            <h4>Message</h4>
            <textarea id="message" placeholder="Write your message here..."></textarea>
        </div>


        <div class="button-group">
            <button id="submitBtn">Submit</button>
            <button id="updateBtn" disabled>Update</button>
        </div>

        <div class="details-box">
            <div class="details-header">
                <h2>Contact Details</h2>
                <button id="editBtn">Edit</button>
            </div>

            <div id="contact-info">
                No contact details submitted yet.
            </div>
        </div>

    </div>

    <script type="module" src="contactus.js"></script>

</body>
</html>
